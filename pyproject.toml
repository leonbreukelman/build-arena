[project]
name = "build-arena"
version = "0.1.0"
description = "Local-first autonomous build arena with anti-fabrication scorer calibration"
requires-python = ">=3.12"
dependencies = [
    "linkml>=1.8.7",
    "mabwiser>=2.7.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["arena/generated", ".arena/calibration/repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["arena", "scorer", "verifier", "scripts", "tests"]
exclude = ["arena/generated", ".arena/calibration/repo"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["arena", "scorer", "verifier", "scripts"]
omit = ["arena/generated/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "def .*: \\.\\.\\.",
]
