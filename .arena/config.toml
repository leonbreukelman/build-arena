[runners]
default = "claude_code"
fallback = "ollama"
ablation = "ollama"
cold_start_round_robin = ["runtime×core", "coverage×errors", "typing×validate"]

[fingerprint]
embedding_model = "BAAI/bge-small-en-v1.5"
embedding_dim = 384
quantization_buckets = 256
hash_prefix_bytes = 16

[verifier]
require_tests_pass = true
require_score_delta_gt0 = true
ablation_probe_set = ["EARLY_ANSWERING", "FILLER_TOKENS", "PARAPHRASING"]
ablation_quorum = 2
fp_target = 0.0
fn_target = 0.10
